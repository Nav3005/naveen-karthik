<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Under Construction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            padding: 40px 20px;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        .main-title {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(45deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientShift 4s ease-in-out infinite;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }

        .subtitle {
            font-size: 1.8rem;
            color: white;
            margin-bottom: 30px;
            opacity: 0.9;
            font-weight: 300;
        }

        .construction-icon {
            font-size: 8rem;
            margin: 40px 0;
            animation: bounce 2s infinite;
        }

        .description {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .progress-container {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 8px;
            margin: 40px auto;
            max-width: 400px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .progress-bar {
            background: linear-gradient(90deg, #ff6b6b, #feca57);
            height: 20px;
            border-radius: 50px;
            width: 75%;
            animation: progressGlow 2s ease-in-out infinite alternate;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: shine 2s infinite;
        }

        .progress-text {
            color: white;
            margin-top: 15px;
            font-weight: 500;
        }

        .contact-section {
            margin-top: 70px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .contact-title {
            font-size: 1.5rem;
            color: white;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            color: rgba(255, 255, 255, 0.9);
            transition: transform 0.3s ease;
            font-size: 1.1rem;
        }

        .contact-item .icon {
            font-size: 1.4rem;
            width: 30px;
            display: flex;
            justify-content: center;
        }

        .contact-item:hover {
            transform: translateY(-3px);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .social-link {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .social-link:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .floating-elements {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .floating-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .circle-1 {
            width: 100px;
            height: 100px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .circle-2 {
            width: 60px;
            height: 60px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .circle-3 {
            width: 80px;
            height: 80px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            padding: 15px 25px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.5s ease-out;
            z-index: 1000;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }

        @keyframes progressGlow {
            0% { box-shadow: 0 0 10px rgba(255, 107, 107, 0.5); }
            100% { box-shadow: 0 0 25px rgba(254, 202, 87, 0.8); }
        }

        @keyframes shine {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.3rem;
            }
            
            .construction-icon {
                font-size: 5rem;
            }
            
            .contact-info {
                flex-direction: column;
                align-items: center;
            }
            
            .notification {
                position: relative;
                top: auto;
                right: auto;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-circle circle-1"></div>
        <div class="floating-circle circle-2"></div>
        <div class="floating-circle circle-3"></div>
    </div>

    <div class="notification" id="notification">
        🚀 Portfolio launching soon!
    </div>

    <div class="container">
        <h1 class="main-title">UNDER CONSTRUCTION</h1>
        <p class="subtitle">Portfolio in Progress</p>
        
        <div class="construction-icon">🚧</div>
        
        <p class="description">
            I'm currently crafting an amazing portfolio experience that will showcase my work, 
            skills, and creative journey. Stay tuned for something extraordinary!
        </p>

        <div class="progress-container">
            <div class="progress-bar"></div>
            <div class="progress-text">75% Complete</div>
        </div>

        <div class="contact-section">
            <h2 class="contact-title">Get In Touch</h2>
            
            <div class="social-links">
                <a href="mailto:rknaveenkarthik@gmail.com" class="social-link" title="LinkedIn">💼</a>
                <a href="http://github.com/Nav3005" class="social-link" title="GitHub">🐱</a>
                <a href="http://linkedin.com/in/naveen-karthik" class="social-link" title="LinkedIn">In</a>
            </div>
        </div>
    </div>

    <script>
        // Hide notification after 5 seconds
        setTimeout(() => {
            const notification = document.getElementById('notification');
            if (notification) {
                notification.style.opacity = '0';
                notification.style.transform = 'translateX(100%)';
                setTimeout(() => notification.remove(), 500);
            }
        }, 5000);

        // Add interactive hover effects to main title
        const mainTitle = document.querySelector('.main-title');
        mainTitle.addEventListener('mouseenter', () => {
            mainTitle.style.transform = 'scale(1.05)';
            mainTitle.style.transition = 'transform 0.3s ease';
        });

        mainTitle.addEventListener('mouseleave', () => {
            mainTitle.style.transform = 'scale(1)';
        });

        // Animate progress bar on page load
        window.addEventListener('load', () => {
            const progressBar = document.querySelector('.progress-bar');
            progressBar.style.width = '0%';
            setTimeout(() => {
                progressBar.style.transition = 'width 2s ease-out';
                progressBar.style.width = '75%';
            }, 500);
        });

        // Add click effect to construction icon
        const constructionIcon = document.querySelector('.construction-icon');
        constructionIcon.addEventListener('click', () => {
            constructionIcon.style.transform = 'scale(1.2) rotate(15deg)';
            setTimeout(() => {
                constructionIcon.style.transform = 'scale(1) rotate(0deg)';
            }, 300);
        });
    </script>
</body>
</html>
